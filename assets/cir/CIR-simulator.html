    //  get current time
    function getcircurrenttime(time_type)
    {
        var cirtime = new Date();
        if(time_type == 1)      //  返回YY:MM:DD:hh:mm:ss
            return cirtime.getFullYear() + "年" + (parseInt(cirtime.getMonth())+1).toString() + "月" + cirtime.getDate() + "日" + cirtime.getHours() + "时" + cirtime.getMinutes() + "分" + cirtime.getSeconds() + "秒" + "（未签收）";
        else if(time_type == 2)     //  返回hh:mm:ss
            return cirtime.getHours() + "时" + cirtime.getMinutes() + "分" + cirtime.getSeconds() + "秒";
        else
            return cirtime.getHours() + ":" + cirtime.getMinutes() + ":" + cirtime.getSeconds();

    }

    //  save ddml, jlyg, crkjc info
    function saveinfo(save_type)
    {
        var infostep = 14;
        if(save_type == 1)      //  未签收
        {
            infosave[0] += 1;
            
            for(var i = 1;i <= 9;i++)
                infosave.push(document.getElementById("infotext"+infosave[i]).innerText);       //  保存基本数据
            //console.log(document.getElementById("infotext"+infosave[i]).innerText);
            if(infosave[0] <= 10)
            {
                infosave[infostep + 3] = infosave[infostep + 4] = 1;        //    页码计算
                document.getElementById("infotext17").innerHTML = infosave[infostep + 3];
                document.getElementById("infotext19").innerHTML = infosave[infostep + 4];
            }
        }
        else        //  已签收
        {
            if(infosave[0] == 1)
                infosave[14] = document.getElementById("infotext11").innerText;     //  保存签收时间戳
            else
                infostep += 10;
                infosave[infostep] = document.getElementById("infotext11").innerText;     //  保存签收时间戳
            infosave[infostep + 5] = document.getElementById("infobox2").innerHTML;       //  保存签收信息
        }
    }
